[project]
name = "podcast-factcheck"
version = "0.1.0"
description = "Automated, source-cited fact-checking of podcast episodes, published as a static site."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.10,<3",
  "assemblyai>=1.10,<2",
  "feedparser>=6,<7",
  "jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
]

[tool.setuptools]
packages = ["factcheck"]
