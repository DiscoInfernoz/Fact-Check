name: Fact-check episodes

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "Look at the newest N episodes in the feed"
        default: "5"
      max_episodes:
        description: "Process at most N pending episodes in this run"
        default: "5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: factcheck
  cancel-in-progress: false

jobs:
  factcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      FEED_URL: ${{ vars.FEED_URL }}
      CORRECTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/issues/new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .

      - name: Discover and check episodes
        run: >
          python -m factcheck run
          --backfill "${{ inputs.backfill || '3' }}"
          --max-episodes "${{ inputs.max_episodes || '3' }}"

      - name: Commit results
        if: always()
        run: |
          git config user.name "factcheck-bot"
          git config user.email "factcheck-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Fact-check update $(date -u +%F)"
          git push

      - name: Build site
        if: always()
        run: python -m factcheck build
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  deploy:
    needs: factcheck
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
